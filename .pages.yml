media: 
    input: public
    output: /
content:
  - name: cities
    label: Города
    type: collection
    path: src/content/cities
    filename: 
      template: "{slug}.md"
      field: true
    view:
      fields: [title]
    fields:
      - name: title
        label: Заголовок на странице
        type: string
      - name: body
        type: rich-text
  - name: services
    label: Сервисы
    type: collection
    path: src/content/services
    subfolders: true
    filename:
      template: "{slug}.md"
      field: true
    view:
      fields: [title]
    fields:
      - name: title
        label: Заголовок на странице
        type: string
      - name: body
        type: rich-text
      - name: created
        type: date
      - name: lastmod
        type: date